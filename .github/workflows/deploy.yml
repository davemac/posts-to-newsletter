# Deploys a published GitHub release to the WordPress.org plugin repository.
#
# Prerequisites (one-time, before the first release will succeed):
#   1. The "posts-to-newsletter" plugin must be approved/live on WordPress.org.
#   2. Add repo secrets SVN_USERNAME and SVN_PASSWORD (your WordPress.org login).
#
# The 10up action honours .distignore, so dev files are excluded from the build.
name: Deploy to WordPress.org

on:
  release:
    types: [published]

jobs:
  deploy:
    name: Deploy to WordPress.org
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: WordPress.org plugin deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: dmc-posts-to-newsletter-builder
